#Start: docker compose up jupyter   (oder dashboard, docs, app)
#Die Rohdaten liegen nicht im Image. Sie müssen lokal unter data/raw/ liegen und werden eingehängt.
x-projekt: &projekt
  build: .
  image: fernwaerme-projekt
  working_dir: /app
  volumes:
    - ./data:/app/data
    - ./outputs:/app/outputs
    - ./models:/app/models
    - ./notebooks:/app/notebooks
    - ./src:/app/src
    - ./docs:/app/docs

services:
  #Notebooks im Browser: http://localhost:8888
  jupyter:
    <<: *projekt
    ports:
      - "127.0.0.1:8888:8888"

  #Dashboard (Streamlit-App): http://localhost:8000
  #Vorher Notebook 37 ausführen, es schreibt die Daten nach outputs/dashboard/app/.
  dashboard:
    <<: *projekt
    ports:
      - "127.0.0.1:8000:8000"
    command: ["streamlit", "run", "src/dashboard_app.py", "--server.port", "8000", "--server.address", "0.0.0.0"]

  #Dokumentation wie auf Read the Docs: http://localhost:8001
  docs:
    <<: *projekt
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml
    command: ["mkdocs", "serve", "-a", "0.0.0.0:8001"]

