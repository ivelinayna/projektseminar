site_name: Fehlererkennung im Fernwärmenetz
site_description: >-
  Projektseminar JMU Würzburg mit der ÜZ Mainfranken: Fehler in
  Hausübergabestationen aus Zählerdaten erkennen.
docs_dir: docs
# Alte Seiten aus dem Abgabestand: bleiben im Repo, werden aber nicht gebaut
exclude_docs: |
  /anhang.md
  /begriffe.md
  /dashboard.md
  /daten.md
  /docker.md
  /endmodell.md
  /ergebnisse.md
  /grenzen.md
  /modellvergleich.md
  /negativbefunde.md
  /notebooks.md
  /pipeline.md
  /schnellstart.md
  /stationsbilder.md
theme:
  name: material
  language: de
  logo: assets/logo/siegel_weiss.png
  favicon: assets/logo/favicon.png
  palette:
    primary: custom
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: de
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css

nav:
  - Einleitung: 
      - Ausgangslage: index.md
      - Aufgabe und Ziel: aufgabe_und_ziel.md
      - Aufbau der Arbeit: aufbau.md

  # - Installation und Ausführung:   # noch leer
      # - Vorbereitung:   # noch leer
      # - Start mit Docker:   # noch leer
      # - Ausführung bis zum Dashboard:   # noch leer
      # - Lokaler Start ohne Docker:   # noch leer
      
  - Datengrundlage: 
      - Zählerdaten: daten_zaehlerdaten.md
      - Begehungen: daten_begehungen.md
      - Netz und Zuordnung: daten_netz_und_zuordnung.md
      - Ergänzende Daten: daten_ergaenzend.md
      - Qualität und Einschränkungen: daten_qualiaet.md

  - Vorgehen:
      # - Überblick:   # noch leer
      # - Daten aufbereiten:   # noch leer
      # - Begehungen auswerten:   # noch leer
      # - Merkmale und Clustering:   # noch leer
      # - Stationsbilder und Befunde:   # noch leer
      # - Anomalien und Monitoring:   # noch leer
      - Lernende Modelle:
          - Überblick: modelle/index.md
          - Daten, Labels und Messlatte: modelle/daten.md
          - LSTM-Fingerabdruck: modelle/lstm.md
          - Prognose-LSTM als Wächter: modelle/prognose.md
          - Fehlerart und Klasse je Station: modelle/klassen.md
      # - Netz einbeziehen:   # noch leer
      - Modelle vergleichen:
          - Prüfdesign und Statistik: vergleich/pruefung.md
          - Erster Prüfstand: vergleich/pruefstand.md
          - Strenger Vergleich: vergleich/endmodell.md
      - Was nicht getragen hat: nicht_getragen.md
     
  - Ergebnisse:
      # - Überblick:   # noch leer
      # - Datenanalyse:   # noch leer
      - Endmodell: ergebnisse_endmodell.md
      - Handlungsempfehlungen: ergebnisse_handlungsempfehlungen.md
      - Dashboard: ergebnisse_dashboard.md

  - Grenzen und Erkenntnisse:
      # - Annahmen:   # noch leer
      # - Grenzen der Daten:   # noch leer
      - Grenzen der Modelle: grenzen_modelle.md
      - Erkenntnisse: erkenntnisse.md

  - Ausblick:
      - Probebetrieb: ausblick_probebetrieb.md
      - Prüfung nach vorn: ausblick_pruefung.md
      - Weiterentwicklung: ausblick_weiterentwicklung.md
      # - Offene Fragen an die ÜZ:   # noch leer

  - Aufteilung im Team: aufteilung.md

  # - Anhang:   # noch leer
