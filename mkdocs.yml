site_name: Fernwärme Fault Detection — ÜZ Mainfranken
site_description: >-
  Projektseminar JMU Würzburg: datengestützte Fehlererkennung und
  Leistungsoptimierung im Fernwärmenetz Wiesentheid.
docs_dir: docs
theme:
  name: material
  language: de
  palette:
    primary: blue grey
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: de
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
nav:
  - Übersicht: README.md
  - Pipeline: pipeline.md
