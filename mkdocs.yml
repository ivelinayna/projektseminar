site_name: Fehlererkennung im Fernwärmenetz
site_description: >-
  Projektseminar JMU Würzburg mit der ÜZ Mainfranken: Fehler in
  Hausübergabestationen aus Zählerdaten erkennen.
docs_dir: docs
theme:
  name: material
  language: de
  palette:
    primary: blue grey
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: de
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
nav:
  - Start: index.md
  - Erste Schritte:
      - Schnellstart: schnellstart.md
      - Docker: docker.md
      - Daten: daten.md
  - Notebooks: notebooks.md
  - Ergebnisse:
      - Überblick: ergebnisse.md
      - Stationsbilder und Befunde: stationsbilder.md
      - Modellvergleich: modellvergleich.md
      - Endmodell: endmodell.md
      - Negativbefunde: negativbefunde.md
  - Technik:
      - Pipeline und Module: pipeline.md
      - Dashboard: dashboard.md
  - Grenzen und offene Fragen: grenzen.md
  - Begriffe: begriffe.md
