site_name: Fehlererkennung im Fernwärmenetz
site_description: >-
  Projektseminar JMU Würzburg mit der ÜZ Mainfranken: Fehler in
  Hausübergabestationen aus Zählerdaten erkennen.
docs_dir: docs
theme:
  name: material
  language: de
  palette:
    primary: blue grey
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: de
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css

nav:
