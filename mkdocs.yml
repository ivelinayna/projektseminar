site_name: Fehlererkennung im Fernwärmenetz
site_description: >-
  Projektseminar JMU Würzburg mit der ÜZ Mainfranken: Fehler in
  Hausübergabestationen aus Zählerdaten erkennen.
docs_dir: docs
theme:
  name: material
  language: de
  logo: assets/logo/siegel_weiss.png
  favicon: assets/logo/favicon.png
  palette:
    primary: custom
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: de
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css

nav:
  - Einleitung:
      - Ausgangslage: index.md
      - Aufgabe und Ziel: einleitung/aufgabe_und_ziel.md
      - Aufbau der Arbeit: einleitung/aufbau.md

  - Installation und Ausführung:
      - Vorbereitung: installation/vorbereitung.md
      - Start mit Docker: installation/docker.md
      - Lokaler Start ohne Docker: installation/lokal.md
      - Ausführung bis zum Dashboard: installation/ausfuehrung.md
      - Schnellstart: installation/schnellstart.md
      - Befehle und Module: installation/pipeline.md

  - Datengrundlage:
      - Zählerdaten: datengrundlage/zaehlerdaten.md
      - Begehungen: datengrundlage/begehungen.md
      - Netz und Zuordnung: datengrundlage/netz_und_zuordnung.md
      - Ergänzende Daten: datengrundlage/ergaenzend.md
      - Qualität und Einschränkungen: datengrundlage/qualitaet.md

  - Vorgehen:
      - Überblick der Notebooks: notebooks/index.md
      - Daten aufbereiten:
          - Überblick: aufbereitung/index.md
          - Die Schritte im Einzelnen: aufbereitung/schritte.md
          - "Änderungen 1: Rohdaten lesbar machen": aufbereitung/rohdaten.md
          - "Änderungen 2: Kennzahlen ans Raster anpassen": aufbereitung/kennzahlen.md
          - "Änderungen 3: Rückmeldung der ÜZ": aufbereitung/uez_rueckmeldung.md
      - Begehungen auswerten:
          - Überblick: begehungen/index.md
          - Wirkung im 21-Tage-Fenster: begehungen/wirkung.md
          - Label aus Messdaten: begehungen/labels.md
          - Wintervergleich: begehungen/wintervergleich.md
          - Performance: begehungen/performance.md
          - Prognose mit ARIMA: begehungen/arima.md
      - Merkmale und Clustering:
          - Überblick: clustering/index.md
          - Stationscluster: clustering/stationscluster.md
          - Vier Verfahren im Vergleich: clustering/benchmark.md
          - Stundencluster und Validierung: clustering/validierung.md
          - Tagescluster: clustering/tagescluster.md
      - Stationsbilder und Befunde: stationsbilder/index.md
      - Anomalien und Monitoring:
          - Überblick: monitoring/index.md
          - Anomalieerkennung ohne Labels: monitoring/anomalie.md
          - Von der Anomalie zur Empfehlung: monitoring/empfehlung.md
          - Normalverhaltensmodell: monitoring/normalverhalten.md
          - Netzvergleich und Wintervergleich: monitoring/netzvergleich.md
          - Tagesmonitor: monitoring/tagesmonitor.md
          - Alarme bewerten: monitoring/alarme.md
          - Bestes Viertel als Maßstab: monitoring/bestwert.md
          - Vergleichsgruppen und Nachbarn: monitoring/nachbarn.md
          - Netzereignisse: monitoring/netzereignisse.md
      - Lernende Modelle:
          - Überblick: modelle/index.md
          - Daten, Labels und Messlatte: modelle/daten.md
          - LSTM-Fingerabdruck: modelle/lstm.md
          - Prognose-LSTM als Wächter: modelle/prognose.md
          - Fehlerart und Klasse je Station: modelle/klassen.md
      - Netz einbeziehen:
          - Überblick: netz_einbeziehen/index.md
          - Vom Haus-Graph zum Rohrbaum: netz_einbeziehen/rohrbaum.md
          - Haus oder Netz: netz_einbeziehen/haus_oder_netz.md
          - Fehlererkennung mit Netz-Merkmalen: netz_einbeziehen/fehlererkennung.md
      - Modelle vergleichen:
          - Prüfdesign und Statistik: vergleich/pruefung.md
          - Modellvergleich: vergleich/modellvergleich.md
      - Was nicht getragen hat:
          - Überblick: nicht_getragen/index.md
          - Negativbefunde im Detail: nicht_getragen/negativbefunde.md
          - "Bayes-Diagnose": nicht_getragen/bayes.md
          - "GNN: Hilft das Netz?": nicht_getragen/gnn.md

  - Ergebnisse:
      - Überblick: ergebnisse/index.md
      # - Datenanalyse:   # noch leer
      - Endmodell: ergebnisse/endmodell.md
      - Handlungsempfehlungen: ergebnisse/handlungsempfehlungen.md
      - Dashboard: ergebnisse/dashboard.md
      - Dashboard bedienen: ergebnisse/dashboard_bedienen.md

  - Grenzen und Erkenntnisse:
      - Annahmen, Grenzen und offene Fragen: grenzen/index.md
      - Grenzen der Modelle: grenzen/modelle.md
      - Erkenntnisse: grenzen/erkenntnisse.md

  - Ausblick:
      - Probebetrieb: ausblick/probebetrieb.md
      - Prüfung nach vorn: ausblick/pruefung.md
      - Weiterentwicklung: ausblick/weiterentwicklung.md
      # - Offene Fragen an die ÜZ:   # noch leer, bisher in grenzen.md

  - Aufteilung im Team: aufteilung/index.md

  - Anhang:
      - Begriffe: anhang/begriffe.md
